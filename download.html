<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Download CocoGuard App</title>
  <style>
    :root {
      --bg: #f4f8f2;
      --card: #ffffff;
      --green: #1f9d48;
      --green-dark: #147033;
      --text: #1f2937;
      --muted: #6b7280;
    }
    body {
      margin: 0;
      font-family: Segoe UI, Tahoma, sans-serif;
      background: radial-gradient(circle at top, #dff7e7, var(--bg));
      color: var(--text);
      min-height: 100vh;
      display: grid;
      place-items: center;
      padding: 20px;
    }
    .card {
      width: min(560px, 100%);
      background: var(--card);
      border-radius: 16px;
      box-shadow: 0 20px 50px rgba(0, 0, 0, 0.12);
      padding: 28px;
      text-align: center;
    }
    h1 {
      margin: 0 0 8px;
      font-size: 30px;
      color: var(--green-dark);
    }
    p {
      margin: 0 0 18px;
      color: var(--muted);
    }
    .btn {
      display: inline-block;
      background: var(--green);
      color: #fff;
      text-decoration: none;
      font-weight: 700;
      border-radius: 12px;
      padding: 14px 24px;
      transition: transform .15s ease, background .15s ease;
    }
    .btn:hover {
      background: var(--green-dark);
      transform: translateY(-1px);
    }
    .links {
      margin-top: 14px;
      font-size: 14px;
    }
    .links a {
      color: var(--green-dark);
      text-decoration: none;
    }
  </style>
</head>
<body>
  <main class="card">
    <h1>Download CocoGuard App</h1>
    <p>Official Android APK download page.</p>
    <a class="btn" href="https://github.com/maynardermita77-lang/cocoguard/releases/download/v1.0.0/app-release.apk">Download APK</a>
    <div class="links">
      <a href="/">Back to Login</a>
    </div>
  </main>
</body>
</html>
