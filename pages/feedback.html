<div class="table-card">
        <h3 data-i18n="feedback.title">User Feedback & Reports</h3>
        <table>
            <thead>
                <tr>
                    <th data-i18n="table.user">User</th>
                    <th data-i18n="table.date_time">Date</th>
                    <th data-i18n="table.type">Type</th>
                    <th data-i18n="table.status">Status</th>
                    <th data-i18n="table.message">Message</th>
                    <th data-i18n="table.actions">Actions</th>
                </tr>
            </thead>
            <tbody id="feedbackTableBody">
                <tr>
                    <td colspan="6" style="text-align: center; padding: 20px; color: #666;">Loading feedback...</td>
                </tr>
            </tbody>
        </table>
    </div>

    <!-- Feedback Response Modal -->
    <div id="feedbackResponseModal" class="modal" style="display:none;">
        <div class="modal-content" style="max-width: 500px;">
            <span class="modal-close" onclick="window.feedbackModule.closeResponseModal()">&times;</span>
            <h3 style="margin-bottom: 20px;">Respond to Feedback</h3>
            
            <div id="feedbackDetails" style="background: #f5f5f5; padding: 15px; border-radius: 8px; margin-bottom: 20px;">
                <p><strong>User:</strong> <span id="modalFeedbackUser">-</span></p>
                <p><strong>Type:</strong> <span id="modalFeedbackType">-</span></p>
                <p><strong>Message:</strong> <span id="modalFeedbackMessage">-</span></p>
            </div>
            
            <form id="feedbackResponseForm">
                <input type="hidden" id="feedbackId">
                
                <div class="form-group" style="margin-bottom: 15px;">
                    <label for="feedbackStatus" style="display: block; margin-bottom: 5px; font-weight: 600;">Status:</label>
                    <select id="feedbackStatus" required style="width: 100%; padding: 10px; border: 1px solid #ddd; border-radius: 6px;">
                        <option value="Received">Received</option>
                        <option value="In Review">In Review</option>
                        <option value="Real Pest">Real Pest</option>
                        <option value="New Pest">New Pest</option>
                        <option value="Not a Pest">Not a Pest</option>
                        <option value="Resolved">Resolved</option>
                    </select>
                </div>
                
                <div class="form-group" style="margin-bottom: 20px;">
                    <label for="adminResponse" style="display: block; margin-bottom: 5px; font-weight: 600;">Response (optional):</label>
                    <textarea id="adminResponse" rows="4" placeholder="Enter your response to the user..." style="width: 100%; padding: 10px; border: 1px solid #ddd; border-radius: 6px; resize: vertical;"></textarea>
                </div>
                
                <div style="display: flex; gap: 10px; justify-content: flex-end;">
                    <button type="button" onclick="window.feedbackModule.closeResponseModal()" style="padding: 10px 20px; border: 1px solid #ddd; border-radius: 6px; background: white; cursor: pointer;">Cancel</button>
                    <button type="submit" style="padding: 10px 20px; border: none; border-radius: 6px; background: #4CAF50; color: white; cursor: pointer; font-weight: 600;">Submit Response</button>
                </div>
            </form>
        </div>
    </div>
