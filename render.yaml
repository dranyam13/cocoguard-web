services:
  # CocoGuard Web Frontend (Static Site)
  - type: static
    name: cocoguard-web
    buildCommand: echo "No build needed - static files"
    staticPublishPath: .
    headers:
      - path: /*
        name: Cache-Control
        value: public, max-age=3600
    routes:
      - type: rewrite
        source: /*
        destination: /index.html
    autoDeploy: true
